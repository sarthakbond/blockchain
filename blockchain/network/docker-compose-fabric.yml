# Hyperledger Fabric Reference Network for FUSION
# 3 Banks: OrgAlpha (peer0.alpha.fusion.net), OrgBeta (peer0.beta.fusion.net), OrgGamma (peer0.gamma.fusion.net)
# Consensus: Raft Orderer (orderer.fusion.net)
# Channel: fusion-kyc-channel

version: '3.7'

networks:
  fusion-net:
    name: fusion-net

services:
  orderer.fusion.net:
    image: hyperledger/fabric-orderer:2.5
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
    ports:
      - "7050:7050"
    networks:
      - fusion-net

  peer0.alpha.fusion.net:
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_ID=peer0.alpha.fusion.net
      - CORE_PEER_ADDRESS=peer0.alpha.fusion.net:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_LOCALMSPID=OrgAlphaMSP
    ports:
      - "7051:7051"
    networks:
      - fusion-net

  peer0.beta.fusion.net:
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_ID=peer0.beta.fusion.net
      - CORE_PEER_ADDRESS=peer0.beta.fusion.net:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_LOCALMSPID=OrgBetaMSP
    ports:
      - "8051:8051"
    networks:
      - fusion-net

  peer0.gamma.fusion.net:
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_ID=peer0.gamma.fusion.net
      - CORE_PEER_ADDRESS=peer0.gamma.fusion.net:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_LOCALMSPID=OrgGammaMSP
    ports:
      - "9051:9051"
    networks:
      - fusion-net
